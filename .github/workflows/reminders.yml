name: reminders

# Calls the reminder dispatcher every 30 minutes (Vercel Hobby cron is limited to once a day, so this
# is the real scheduler; vercel.json only adds a daily backup call).
# Repository secrets to add (Settings > Secrets and variables > Actions):
#   APP_URL      production base URL, no trailing slash, e.g. https://dawrak.vercel.app
#   CRON_SECRET  the same value as the CRON_SECRET environment variable on Vercel
# Note: GitHub may delay scheduled runs by several minutes, and disables schedules after 60 days
# without repository activity.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the reminders endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET repository secrets are required" >&2
            exit 1
          fi
          # --fail-with-body: a non-2xx status fails the job (the body, which holds no secrets, is printed)
          curl --silent --show-error --fail-with-body --max-time 90 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/reminders"
          echo
